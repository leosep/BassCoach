name: Build installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install the WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.1
          wix eula accept wix7
          wix extension add --global WixToolset.UI.wixext/7.0.1
          wix extension add --global WixToolset.Util.wixext/7.0.1
      - name: Self-tests (theory, pitch detection, band, evaluation, view models)
        run: dotnet run --project tests/BassCoach.SelfTest -c Release
      - name: Publish the app (self-contained, no .NET install needed by users)
        run: dotnet publish src/BassCoach.Desktop/BassCoach.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Build and validate the MSI
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = @(([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version)[0]
          }
          $msi = "dist/Install-BassCoach-$version-x64.msi"
          wix build installer/BassCoach.wxs -arch x64 -d AppVersion=$version -d PublishDir="$PWD/publish" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -o $msi
          wix msi validate $msi
          Get-FileHash $msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bass-coach-installer
          path: dist/*
      - name: Attach to the release (tags vX.Y.Z only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/SHA256SUMS.txt
